name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # playwright is only used by scripts/browser-smoke.mjs, which CI does
          # not run (see below). Skip the ~150MB browser download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      # The escape check is gone: it existed because the SPA lived in template
      # literals that tsc could not see inside. The client is real .tsx now, so
      # typecheck covers what the scanner used to guess at.

      # Builds before testing so assets.directory exists when wrangler reads it.
      - name: Build and test
        run: npm run test:ci

      # NOT RUN HERE: scripts/browser-smoke.mjs. It needs a live `wrangler dev`,
      # which refuses to start without CLOUDFLARE_API_TOKEN because the Workers
      # AI binding always resolves remotely. Wiring it up means either putting a
      # token in CI or testing against a config with the AI binding stripped,
      # which would no longer be the config we deploy. Run it locally instead —
      # see the header of that script.

      # Advisory until the codebase is fully formatted (see Phase: tooling).
      - name: Format check (Prettier)
        run: npx --yes prettier@3.3.3 --check "src/**/*.{ts,tsx}"
        continue-on-error: true
