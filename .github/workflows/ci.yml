name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The SPA has no build step, so tsc cannot see inside the template
      # literals it lives in. This catches backslash escapes the literal strips.
      # Delete once the inline SPA is gone.
      - name: Frontend escape check
        run: npm run check:escapes

      # Builds before testing: assets.directory points at the build output, so
      # the tests that exercise /branding/* need it to exist.
      - name: Build and test
        run: npm run test:ci

      # Advisory until the codebase is fully formatted (see Phase: tooling).
      - name: Format check (Prettier)
        run: npx --yes prettier@3.3.3 --check "src/**/*.{ts,tsx}"
        continue-on-error: true
